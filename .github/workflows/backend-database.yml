name: Backend database suite

on:
  push:
    branches: [main, feat/offline-first-foundation]
  pull_request:
    paths:
      - 'rork-trotro-ride-clone-main/backend/**'
      - '.github/workflows/backend-database.yml'

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: trotro
          POSTGRES_PASSWORD: trotro
          POSTGRES_DB: trotro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trotro -d trotro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: rork-trotro-ride-clone-main/backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://trotro:trotro@localhost:5432/trotro_test
      PGSSL: 'false'
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      CORS_ORIGIN: http://localhost:3000
      PAYSTACK_SECRET_KEY: ci-paystack-test-secret
      MAPBOX_ACCESS_TOKEN: ci-mapbox-test-token
      FIREBASE_SERVICE_ACCOUNT: '{}'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rork-trotro-ride-clone-main/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations
        run: npm run migrate
      - name: Verify database invariants
        run: npm run verify:database
      - name: Re-run migrations for idempotency
        run: npm run migrate
      - name: Run backend tests
        run: npm test -- --runInBand
