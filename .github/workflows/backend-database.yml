name: Backend database suite

on:
  push:
    branches: [main, feat/offline-first-foundation]
  pull_request:
    paths:
      - 'rork-trotro-ride-clone-main/backend/**'
      - '.github/workflows/backend-database.yml'

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: trotro
          POSTGRES_PASSWORD: trotro
          POSTGRES_DB: trotro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trotro -d trotro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: rork-trotro-ride-clone-main/backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://trotro:trotro@localhost:5432/trotro_test
      PGSSL: 'false'
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      CORS_ORIGIN: http://localhost:3000
      PAYSTACK_SECRET_KEY: ci-paystack-test-secret
      MAPBOX_ACCESS_TOKEN: ci-mapbox-test-token
      FIREBASE_SERVICE_ACCOUNT: '{}'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rork-trotro-ride-clone-main/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations
        run: npm run migrate
      - name: Verify database invariants
        run: npm run verify:database
      - name: Re-run migrations for idempotency
        run: npm run migrate
      - name: Run real PostGIS sync integration suite
        run: |
          set -o pipefail
          npm run test:integration:sync 2>&1 | tee integration-sync.log
      - name: Upload database integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-database-integration-evidence
          path: rork-trotro-ride-clone-main/backend/integration-sync.log
          if-no-files-found: ignore
      - name: Backup and restore disposable database
        run: |
          set -o pipefail
          {
            set -euo pipefail
            pg_dump --version
            pg_restore --version
            pg_dump --format=custom --no-owner --no-privileges --file=ci-backup.dump "$DATABASE_URL"
            dropdb --if-exists --host=localhost --username=trotro trotro_restore
            createdb --host=localhost --username=trotro trotro_restore
            RESTORE_DATABASE_URL=postgresql://trotro:trotro@localhost:5432/trotro_restore
            pg_restore --exit-on-error --no-owner --no-privileges --dbname="$RESTORE_DATABASE_URL" ci-backup.dump
            psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 --command="select postgis_version();"
            psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 --command="select count(*) as migration_rows from public.schema_migrations;"
            psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 --command="select count(*) as booking_rows from public.bookings;"
            rm -f ci-backup.dump
          } 2>&1 | tee backup-restore.log
      - name: Upload backup and restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-database-backup-restore-evidence
          path: |
            rork-trotro-ride-clone-main/backend/backup-restore.log
            rork-trotro-ride-clone-main/backend/ci-backup.dump
          if-no-files-found: ignore
      - name: Run backend tests
        run: npm test -- --runInBand
