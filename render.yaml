services:
  # ── Node.js API ────────────────────────────────────────────────────────────
  - type: web
    name: trotro-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: rork-trotro-ride-clone-main/backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: CACHE_TTL_SECONDS
        value: "60"
      - key: DATABASE_URL
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: ROUTING_RATE_LIMIT_MAX
        value: "30"
      - key: ROUTING_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: MAPBOX_CACHE_TTL_WALKING_SECONDS
        value: "120"
      - key: MAPBOX_CACHE_TTL_DRIVING_SECONDS
        value: "30"
      - key: MAPBOX_CACHE_TTL_TRAFFIC_SECONDS
        value: "15"
      - key: REDIS_URL
        fromService:
          type: redis
          name: trotro-redis
          property: connectionString

  - type: worker
    name: trotro-schedule-worker
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: rork-trotro-ride-clone-main/backend
    buildCommand: npm install
    startCommand: npm run worker:schedule
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: "true"
      - key: SCHEDULE_WORKER_INTERVAL_MS
        value: "60000"
      - key: DATABASE_URL
        sync: false
      - key: SCHEDULED_RESERVATIONS_ENABLED
        sync: false
      - key: SCHEDULED_RESERVATIONS_ROLLOUT_PERCENT
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: trotro-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
