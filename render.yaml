services:
  # ── Node.js API ────────────────────────────────────────────────────────────
  - type: web
    name: trotro-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: rork-trotro-ride-clone-main/backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - fromGroup: trotro-production-backend-secrets
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REQUIRE_REDIS
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
      # Reverse-proxy hops in front of the API. Render's own load balancer is
      # one; put Cloudflare (or anything else) ahead of it and this becomes 2.
      # Getting it wrong makes the rate limiter count proxies instead of
      # users — GET /health echoes the resolved IP so it can be checked.
      - key: TRUST_PROXY
        value: "1"
      - key: CACHE_TTL_SECONDS
        value: "60"
      - key: DATABASE_URL
        sync: false
      - key: ROUTING_RATE_LIMIT_MAX
        value: "30"
      - key: ROUTING_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: MAPBOX_CACHE_TTL_WALKING_SECONDS
        value: "120"
      - key: MAPBOX_CACHE_TTL_DRIVING_SECONDS
        value: "30"
      - key: MAPBOX_CACHE_TTL_TRAFFIC_SECONDS
        value: "15"
      - key: REDIS_URL
        fromService:
          type: redis
          name: trotro-redis
          property: connectionString

  - type: worker
    name: trotro-schedule-worker
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: rork-trotro-ride-clone-main/backend
    buildCommand: npm install
    startCommand: npm run worker:schedule
    envVars:
      - fromGroup: trotro-production-backend-secrets
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: trotro-redis
          property: connectionString
      - key: REQUIRE_REDIS
        value: "true"
      - key: SCHEDULE_WORKER_INTERVAL_MS
        value: "60000"
      - key: DATABASE_URL
        sync: false
      - key: SCHEDULED_RESERVATIONS_ENABLED
        sync: false
      - key: SCHEDULED_RESERVATIONS_ROLLOUT_PERCENT
        sync: false

  # ── Admin dashboard (static site) ──────────────────────────────────────────
  # Set VITE_API_URL to the deployed API's /api base before the first build —
  # Vite inlines it at build time, so changing it later needs a redeploy.
  - type: web
    name: trotro-admin-web
    runtime: static
    rootDir: admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://trotro-api.onrender.com/api
    routes:
      # Single-page app: every unknown path must fall through to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow

  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: trotro-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# Shared backend secrets. Enter values through Render's secret manager; do not
# commit them. The same JWT_SECRET must be used by the API and schedule worker.
envVarGroups:
  - name: trotro-production-backend-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
